services:
  recbot:
    build: .
    image: collxct-recbot:latest
    container_name: collxct-recbot
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - recbot_data:/data
      # Firebase push key. Copy the key to ./secrets/ on the server (it is
      # git-ignored and never baked into the image), then set
      # FCM_CREDENTIALS_FILE=/secrets/firebase-service-account.json in .env.
      - ./secrets/firebase-service-account.json:/secrets/firebase-service-account.json:ro
    networks:
      - collxct_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# recbot.collxct.ng is served by the main Collxct reverse proxy (collxct-nginx-1),
# which terminates TLS and proxies to collxct-recbot:8000 — so this stack no longer
# runs its own nginx or binds a public port. The app just joins the proxy's network.
networks:
  collxct_net:
    external: true
    name: collxct_collxct_net

volumes:
  recbot_data:

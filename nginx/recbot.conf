server {
    # Container listens on 8443; docker-compose maps host 443 -> 8443 (PUBLIC_PORT=443),
    # so the public URL is https://recbot.collxct.ng with no port.
    listen 8443 ssl;
    server_name recbot.collxct.ng;

    ssl_certificate     /etc/letsencrypt/live/recbot.collxct.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recbot.collxct.ng/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://recbot:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
